<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plex Burner</title>
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#e5a00d; --ok:#1a7f37; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#e5a00d; --ok:#3fb950; --bad:#f85149; }
  }
  :root[data-theme="dark"] { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#e5a00d; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; gap:8px; }
  header a { color:var(--text); text-decoration:none; font-weight:600; }
  header nav a { color:var(--muted); font-weight:400; margin-left:14px; }
  main { max-width:900px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { margin:0 0 8px; font-size:17px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; border:1px solid var(--line); font-size:13px; text-transform:capitalize; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .5s; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  input[type=text] { flex:1; min-width:220px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; max-height:260px; overflow:auto; font-size:13px; white-space:pre-wrap; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all; }
  .warn { color:var(--bad); font-weight:600; }
  .picker { border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:10px; }
  .picker ul { list-style:none; margin:8px 0; padding:0; max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:6px; }
  .picker li { padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  .picker li:last-child { border-bottom:0; }
  .picker li:hover { background:var(--bg); }
  .picker li.empty { color:var(--muted); cursor:default; }
  select { padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; max-width:100%; }
  .changelog h3 { font-size:15px; margin:14px 0 4px; }
  .changelog ul { margin:0 0 6px 18px; padding:0; }
  @media (max-width: 600px) { main { padding:12px; } }
</style>
</head>
<body>
<header>
  <a href="./">Plex Burner</a>
  <nav><a href="./">Home</a><a href="https://github.com/bhxuk/Plex_burner">GitHub</a></nav>
</header>
<main>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>Disc</h2>
      <span id="badge" class="badge">idle</span>
    </div>
    <p id="message" class="muted">Loading...</p>
    <div class="bar"><div id="progress"></div></div>
    <div id="nameRow" class="row" hidden>
      <input id="name" type="text" maxlength="120" placeholder="Movie name, e.g. Heat (1995)">
      <button id="start" class="primary">Copy disc</button>
    </div>
    <div class="row">
      <button id="eject">Eject disc</button>
      <span class="muted" id="paths"></span>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between; margin-top:0">
      <h2>Save to</h2>
      <button id="changeDest">Change folder</button>
    </div>
    <div><code id="dest">...</code></div>
    <div id="free" class="muted"></div>
    <div id="picker" class="picker" hidden>
      <div class="row" style="margin-top:0">
        <select id="root" aria-label="Top folder"></select>
        <button id="up">Up one level</button>
      </div>
      <p class="muted" style="margin:8px 0 0">Browsing <code id="pickPath"></code> <span id="pickFree"></span></p>
      <ul id="dirs"></ul>
      <div class="row">
        <input id="newFolder" type="text" maxlength="120" placeholder="New folder name, e.g. Kids Films">
        <button id="mkdir">Create folder</button>
      </div>
      <div class="row">
        <button id="useHere" class="primary">Save discs here</button>
        <button id="cancelPick">Cancel</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log">No activity yet.</pre>
  </section>

  <section class="card">
    <h2>Update</h2>
    <p id="updateInfo" class="muted">Running version {{ version }} ({{ commit }}).</p>
    <div class="row">
      <button id="check">Check for updates</button>
      <button id="apply" class="primary" disabled>Update now</button>
    </div>
    <pre id="updateLog" hidden></pre>
  </section>

  <section class="card changelog">
    <h2>Changelog</h2>
    {{ changelog_html|safe }}
  </section>

</main>
<script>
const $ = (sel) => document.querySelector(sel);
let lastSuggested = null;
let lastStatus = null;

function render(s) {
  $('#badge').textContent = s.status.replace('_', ' ');
  $('#message').textContent = s.message;
  $('#progress').style.width = (s.progress || 0) + '%';
  $('#paths').textContent = 'Drive ' + s.device;
  $('#dest').textContent = s.destination;
  const freeGb = s.free_bytes == null ? null : s.free_bytes / 1e9;
  $('#free').textContent = freeGb == null ? '' : formatFree(s.free_bytes) + ' free' + (freeGb < 10 ? '. Not enough for a full DVD.' : ' (about ' + Math.floor(freeGb / 6) + ' more DVDs)');
  $('#free').className = freeGb != null && freeGb < 10 ? 'warn' : 'muted';
  $('#changeDest').disabled = s.status === 'ripping';
  $('#log').textContent = s.log.join('\n') || 'No activity yet.';
  $('#log').scrollTop = $('#log').scrollHeight;

  const waiting = s.status === 'waiting_name';
  const canStart = waiting || s.status === 'error';
  $('#nameRow').hidden = !canStart;
  if (canStart && (s.suggested !== lastSuggested || lastStatus !== s.status)) {
    $('#name').value = s.suggested || '';
    lastSuggested = s.suggested;
  }
  $('#start').disabled = !canStart;
  $('#eject').disabled = s.status === 'ripping';
  lastStatus = s.status;
}

async function refresh() {
  try {
    const res = await fetch('api/status');
    render(await res.json());
  } catch (e) {
    $('#message').textContent = 'Lost connection to Plex Burner. Retrying...';
  }
}

$('#start').addEventListener('click', async () => {
  const name = $('#name').value.trim();
  const res = await fetch('api/rip', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
  const data = await res.json();
  if (!data.ok) alert(data.message);
  refresh();
});

$('#eject').addEventListener('click', async () => {
  const res = await fetch('api/eject', {method: 'POST'});
  const data = await res.json();
  if (!data.ok) alert(data.message);
  refresh();
});

function formatFree(bytes) {
  return bytes >= 1e12 ? (bytes / 1e12).toFixed(2) + ' TB' : (bytes / 1e9).toFixed(1) + ' GB';
}

// Folder picker
let pickPath = null;

async function browse(path) {
  const res = await fetch('api/folders' + (path ? '?path=' + encodeURIComponent(path) : ''));
  const d = await res.json();
  if (!d.ok) { alert(d.message); return; }
  pickPath = d.path;
  $('#pickPath').textContent = d.path;
  $('#pickFree').textContent = d.free_bytes == null ? '' : '(' + formatFree(d.free_bytes) + ' free)';
  $('#up').disabled = !d.parent;
  $('#up').dataset.parent = d.parent || '';

  const root = $('#root');
  root.innerHTML = '';
  for (const r of d.roots) {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    if (d.path === r || d.path.startsWith(r + '/')) opt.selected = true;
    root.appendChild(opt);
  }

  const list = $('#dirs');
  list.innerHTML = '';
  if (!d.dirs.length) {
    const li = document.createElement('li');
    li.className = 'empty'; li.textContent = 'No folders here';
    list.appendChild(li);
  }
  for (const name of d.dirs) {
    const li = document.createElement('li');
    li.textContent = '📁 ' + name;
    li.addEventListener('click', () => browse(d.path.replace(/\/$/, '') + '/' + name));
    list.appendChild(li);
  }
}

$('#changeDest').addEventListener('click', () => {
  $('#picker').hidden = false;
  browse($('#dest').textContent);
});
$('#cancelPick').addEventListener('click', () => { $('#picker').hidden = true; });
$('#up').addEventListener('click', () => { if ($('#up').dataset.parent) browse($('#up').dataset.parent); });
$('#root').addEventListener('change', (e) => browse(e.target.value));

$('#mkdir').addEventListener('click', async () => {
  const name = $('#newFolder').value.trim();
  if (!name) return;
  const res = await fetch('api/folders', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: pickPath, name})});
  const d = await res.json();
  if (!d.ok) { alert(d.message); return; }
  $('#newFolder').value = '';
  browse(d.path);
});

$('#useHere').addEventListener('click', async () => {
  const res = await fetch('api/destination', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: pickPath})});
  const d = await res.json();
  if (!d.ok) { alert(d.message); return; }
  $('#picker').hidden = true;
  refresh();
});

$('#check').addEventListener('click', async () => {
  $('#updateInfo').textContent = 'Checking GitHub...';
  const res = await fetch('api/update/check');
  const d = await res.json();
  if (!d.ok) { $('#updateInfo').textContent = d.message; return; }
  if (d.update_available) {
    $('#updateInfo').textContent = 'Update available: ' + d.latest + ' - ' + d.latest_message + ' (you have ' + d.current + ')';
    $('#apply').disabled = false;
  } else {
    $('#updateInfo').textContent = 'You are up to date (' + d.current + ').';
    $('#apply').disabled = true;
  }
});

$('#apply').addEventListener('click', async () => {
  if (!confirm('Update Plex Burner now? The page will reload when it finishes.')) return;
  $('#apply').disabled = true;
  const res = await fetch('api/update/apply', {method: 'POST'});
  const d = await res.json();
  if (!d.ok) { alert(d.message); $('#apply').disabled = false; return; }
  $('#updateLog').hidden = false;
  pollUpdate();
});

async function pollUpdate() {
  try {
    const res = await fetch('api/update/status');
    const d = await res.json();
    $('#updateLog').textContent = d.log || 'Starting...';
    if (d.state === 'running') return setTimeout(pollUpdate, 3000);
    if (d.state === 'exited' && d.exit_code === 0) {
      $('#updateInfo').textContent = 'Update finished. Reloading...';
      return setTimeout(() => location.reload(), 4000);
    }
    $('#updateInfo').textContent = 'Update failed. See the log below.';
  } catch (e) {
    // The app restarts during the update, so keep polling until it is back.
    $('#updateInfo').textContent = 'Updating, waiting for Plex Burner to come back...';
    return setTimeout(() => location.reload(), 8000);
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
