# Plex Burner
# Settings live in .env (copy .env.example to .env first). Do not edit this file
# for configuration: in-app updates replace it with newer versions.
services:
  plex-burner:
    build: .
    image: plex-burner:local
    container_name: plex-burner
    # Brings the app back up after an in-app update restarts it.
    restart: unless-stopped

    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      INSTALL_METHOD: docker
      MEDIA_PATHS: ${MEDIA_PATH:-/srv/media},${EXTRA_PATH:-/mnt}

    ports:
      - "${PORT:-9000}:${PORT:-9000}"

    # Every optical drive (sr0, sr1, ...), including USB drives plugged in later.
    # Only optical drives (block major 11) are allowed, nothing else in /dev.
    device_cgroup_rules:
      - "b 11:* rmw"

    volumes:
      # This git checkout. The in-app updater pulls new code into it.
      - ./:/app
      # Lets new drives appear inside the container without a restart.
      - /dev:/dev
      # Your media folder. Copies are saved inside it.
      - ${MEDIA_PATH:-/srv/media}:${MEDIA_PATH:-/srv/media}
      # A second folder for extra drives or network shares. rslave shows shares mounted later.
      - type: bind
        source: ${EXTRA_PATH:-/mnt}
        target: ${EXTRA_PATH:-/mnt}
        bind:
          propagation: rslave
      # Settings, saved locations, history and preview frames.
      - ./data:/data
